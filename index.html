<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KloudAds Cinema Display 32" [Versão Alternativa B]</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #020617;
      --accent: #FFD700;
      --text: #f8fafc;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.15);
      --sidebar-width: 22vw;
      --mega: #209869;
      --quina: #260085;
      --loto: #941156;
      --bg-blue: #003366;
      --bg-gradient: radial-gradient(circle at 10% 10%, #00509e 0%, #003366 45%),
                    radial-gradient(circle at 90% 90%, #004080 0%, #003366 45%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; border: none !important; }

    body, html {
      width: 100vw; height: 100vh; 
      overflow: hidden !important; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-blue); color: var(--text);
    }

    .bg-animation {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-gradient);
      z-index: -1;
    }

    .app-container {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      width: 100%; height: 100%;
    }

    /* SIDEBAR RESPONSIVA */
    .sidebar {
      background: rgba(0, 30, 60, 0.6);
      backdrop-filter: blur(30px);
      padding: 4vh 2vw; 
      display: flex; 
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid var(--glass-border);
      height: 100vh;
      min-width: 280px;
    }

    .clock-section { text-align: center; }
    .clock {
      font-size: 5.5vw; font-weight: 800; line-height: 0.9;
      letter-spacing: -3px; color: var(--accent);
      text-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
    }

    .date {
      font-size: 0.9vw; text-transform: uppercase; letter-spacing: 1px; 
      margin-top: 1.5vh; color: #fff; opacity: 0.9; font-weight: 600;
      white-space: nowrap; display: block;
    }

    /* WEATHER CARD RESPONSIVO */
    .weather-card {
      background: var(--glass); border-radius: 2vw; 
      padding: 3vh 1.5vw; text-align: center;
      border: 1px solid var(--glass-border) !important;
      margin: 2vh 0;
    }

    .city-name { font-size: 1.2vw; font-weight: 800; margin-bottom: 1.5vh; text-transform: uppercase; }
    .w-icon-main { font-size: 4vw; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); line-height: 1.1; }
    .temp-now { font-size: 4.5vw; font-weight: 800; line-height: 1; }
    .w-desc { font-size: 1vw; opacity: 0.9; text-transform: capitalize; margin-bottom: 1.5vh; }

    .w-minmax-row {
      display: flex; gap: 1.5vw; justify-content: center;
      margin-bottom: 2vh; border-top: 1px solid var(--glass-border) !important;
      padding-top: 1.5vh; width: 85%; margin: 0 auto 2vh;
    }
    .w-mm-val { font-size: 1.4vw; font-weight: 800; display: flex; align-items: center; gap: 4px; }

    .w-footer-info {
      display: flex; justify-content: space-around;
      background: rgba(255,255,255,0.05); padding: 1.2vh 1vw; border-radius: 1vw;
    }
    .w-f-val { font-size: 1vw; font-weight: 800; }

    .logo-area { text-align: center; padding-bottom: 1vh; }
    .logo-area img { width: 100%; max-width: 240px; height: auto; object-fit: contain; }
    .site-url { font-size: 0.65vw; letter-spacing: 3px; opacity: 0.6; margin-top: 1vh; }

    /* MAIN AREA RESPONSIVA */
    .main-area { position: relative; padding: 4vh 3vw; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .slide {
      position: absolute; inset: 4vh 3vw 6vh;
      opacity: 0; transform: translateY(20px);
      transition: all 1s ease-in-out;
      visibility: hidden;
      display: flex; flex-direction: column;
    }
    .slide.active { opacity: 1; transform: translateY(0); visibility: visible; }

    .slide-title { font-size: 2.2vw; font-weight: 800; margin-bottom: 3vh; display: flex; align-items: center; gap: 25px; flex-shrink: 0; }
    .slide-title::after { content: ''; height: 4px; flex: 1; background: linear-gradient(90deg, var(--accent), transparent); border-radius: 2px; }

    /* LOTERIAS RESPONSIVAS */
    .lotto-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; flex: 1; margin-bottom: 2vh; min-height: 0; }
    .lotto-card { background: rgba(255,255,255,0.05); border-radius: 3vw; padding: 3vh 1.5vw; border: 1px solid var(--glass-border) !important; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
    .lotto-header { display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 1vh; } 
    .lotto-logo { height: 6.5vh; width: auto; max-width: 90%; object-fit: contain; margin-bottom: 1vh; }
    .lotto-info { font-size: 0.9vw; font-weight: 700; opacity: 0.8; letter-spacing: 1px; text-align: center; }
    .ball-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1vh 0; min-height: 0; }
    
    .ball-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.8vw; max-width: 100%; }
    .ball-grid.mega-line { flex-wrap: nowrap !important; max-width: 100% !important; gap: 0.5vw; }
    .ball-grid.mega-line .ball-item { width: 3.5vw; height: 3.5vw; font-size: 1.4vw; }

    .ball-item { width: 3.8vw; height: 3.8vw; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.6vw; box-shadow: inset -3px -3px 8px rgba(0,0,0,0.4); flex-shrink: 0; }
    
    .prize-box { display: flex; flex-direction: column; justify-content: center; align-items: center; border-top: 1px solid rgba(255,255,255,0.1) !important; padding-top: 2vh; }
    .prize-label { font-size: 0.9vw; font-weight: 700; opacity: 0.6; text-transform: uppercase; margin-bottom: 0.5vh; }
    .prize-amount { font-size: 2.3vw; font-weight: 800; color: var(--accent); text-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; }

    /* NOTÍCIAS RESPONSIVAS */
    .news-wrapper { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2vw; flex: 1; overflow: hidden; margin-bottom: 2vh; min-height: 0; }
    .news-featured { position: relative; border-radius: 2.5vw; overflow: hidden; background: #004080; height: 100%; }
    .news-featured img { width: 100%; height: 100%; object-fit: cover; }
    .news-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 10vh 3vw 4vh; background: linear-gradient(transparent, rgba(0,30,60,0.98)); }
    .news-overlay h3 { font-size: 2.2vw; line-height: 1.2; margin-bottom: 1.5vh; color: var(--accent); font-weight: 800; }
    .news-overlay p { font-size: 1.1vw; opacity: 0.95; line-height: 1.4; }
    
    .news-secondary { display: grid; grid-template-rows: repeat(3, 1fr); gap: 1.5vh; height: 100%; }
    .news-item { background: var(--glass); border-radius: 1.5vw; padding: 2vh 2vw; border: 1px solid var(--glass-border) !important; display: flex; flex-direction: column; justify-content: center; }
    .news-item h4 { font-size: 1.15vw; font-weight: 700; line-height: 1.3; }

    /* HORÓSCOPO RESPONSIVO */
    .horo-grid-full { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1vw; flex: 1; margin-bottom: 2vh; min-height: 0; }
    .horo-box { background: var(--glass); border-radius: 1.5vw; padding: 1.5vh 1.2vw; border: 1px solid var(--glass-border) !important; display: flex; flex-direction: column; overflow: hidden; justify-content: space-between; }
    .horo-box header { display: flex; justify-content: space-between; align-items: center; color: var(--accent); font-size: 1.3vw; font-weight: 800; margin-bottom: 0.8vh; border-bottom: 1px solid rgba(255,255,255,0.1) !important; padding-bottom: 0.5vh; flex-shrink: 0; }
    .horo-box p { font-size: 0.85vw; line-height: 1.3; color: #f1f5f9; font-weight: 500; text-align: left; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; text-overflow: ellipsis; }

    /* PROGRESS BAR */
    .progress-container { position: absolute; bottom: 2vh; left: 3vw; right: 3vw; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #fff); width: 0%; border-radius: 10px; transition: width 0.1s linear; }

    @media (max-width: 1366px), (max-height: 768px) {
      .sidebar { padding: 3vh 2vw; }
      .weather-card { padding: 2vh 1.2vw; margin: 1vh 0; }
      .w-minmax-row { margin-bottom: 1vh; padding-top: 1vh; }
      .lotto-card { padding: 2.5vh 1.2vw; }
      .lotto-logo { height: 5vh; }
      .prize-box { padding-top: 1vh; }
      .ball-item { width: 3.5vw; height: 3.5vw; font-size: 1.5vw; }
      .ball-grid.mega-line .ball-item { width: 3vw; height: 3vw; font-size: 1.3vw; }
      .news-overlay { padding: 8vh 2vw 3vh; }
      .news-overlay h3 { font-size: 2vw; }
      .news-overlay p { font-size: 1vw; }
      .news-item { padding: 1.5vh 1.5vw; }
      .news-item h4 { font-size: 1.05vw; }
      .horo-box { padding: 1vh 1vw; }
      .horo-box header { font-size: 1.1vw; margin-bottom: 0.4vh; }
      .horo-box p { font-size: 0.78vw; -webkit-line-clamp: 3; line-height: 1.2; }
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="clock-section">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">--</div>
      </div>
      <div class="weather-card">
        <div class="city-name">AMERICANA - SP</div>
        <div id="wIcon" class="w-icon-main">--</div>
        <div class="temp-now"><span id="wTemp">--</span>°</div>
        <div class="w-desc" id="wDesc">Carregando...</div>
        <div class="w-minmax-row">
          <div class="w-mm-item"><span class="w-mm-val" style="color: #60a5fa;">↓<span id="wMin">--</span>°</span></div>
          <div class="w-mm-item"><span class="w-mm-val" style="color: #ef4444;">↑<span id="wMax">--</span>°</span></div>
        </div>
        <div class="w-footer-info">
           <div class="w-f-item"><span class="w-f-val"><span id="wFeels">--</span>°C</span></div>
           <div class="w-f-item"><span class="w-f-val"><span id="wHumi">--</span>% UR</span></div>
        </div>
      </div>
      <div class="logo-area">
        <img src="https://site.wpmaster.com.br/wp-content/uploads/2026/04/logo-kloudads-e1776133415159.png" alt="KloudAds">
        <div class="site-url">WWW.KLOUDADS.COM.BR</div>
      </div>
    </aside>

    <main class="main-area">
      <section class="slide active" id="slide0">
        <h2 class="slide-title">Notícias da Região</h2>
        <div class="news-wrapper">
          <div class="news-featured">
            <img src="" id="newsImg0">
            <div class="news-overlay">
              <h3 id="newsTitle0">Buscando notícias...</h3>
              <p id="newsDesc0"></p>
            </div>
          </div>
          <div class="news-secondary">
            <div class="news-item"><h4 id="newsTitle1">...</h4><p id="newsDesc1"></p></div>
            <div class="news-item"><h4 id="newsTitle2">...</h4><p id="newsDesc2"></p></div>
            <div class="news-item"><h4 id="newsTitle3">...</h4><p id="newsDesc3"></p></div>
          </div>
        </div>
      </section>

      <section class="slide" id="slide1">
        <h2 class="slide-title">Resultados Loterias</h2>
        <div class="lotto-layout" id="lottoContent"></div>
      </section>

      <section class="slide" id="slide2">
        <h2 class="slide-title">Horóscopo do Dia</h2>
        <div class="horo-grid-full" id="horoGrid"></div>
      </section>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </main>
  </div>

  <script>
    const SLIDE_DURATION_MS = 10000; // 10 segundos por slide
    const TOTAL_SLIDES = 3;
    const TOTAL_CYCLE_MS = SLIDE_DURATION_MS * TOTAL_SLIDES; // 30 segundos no total

    let allNews = [];
    let currentNewsIndex = 0;
    let activeSlideIndex = 0;

    const NINJAS_API_KEY = 'SUA_CHAVE_AQUI'; 

    const ZODIAC_DATA = [
      {s:'Áries', slug:'aries', i:'♈'}, {s:'Touro', slug:'taurus', i:'♉'},
      {s:'Gêmeos', slug:'gemini', i:'♊'}, {s:'Câncer', slug:'cancer', i:'♋'},
      {s:'Leão', slug:'leo', i:'♌'}, {s:'Virgem', slug:'virgo', i:'♍'},
      {s:'Libra', slug:'libra', i:'♎'}, {s:'Escorpião', slug:'scorpio', i:'♏'},
      {s:'Sagitário', slug:'sagittarius', i:'♐'}, {s:'Capricórnio', slug:'capricorn', i:'♑'},
      {s:'Aquário', slug:'aquarius', i:'♒'}, {s:'Peixes', slug:'pisces', i:'♓'}
    ];

    // ATUALIZA RELÓGIO
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const dateOptions = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', dateOptions).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* =========================================================
       MÉTODO ALTERNATIVO: ALINHAMENTO DE TEMPO ABSOLUTO
       Não importa as pausas do navegador, ele calcula onde deveria estar
       baseado no Timestamp corrente do relógio.
       ========================================================= */
    function syncSlidesBySystemTime() {
      const nowMs = Date.now();
      
      // Encontra a posição exata dentro do ciclo atual de 30 segundos
      const currentCyclePositionMs = nowMs % TOTAL_CYCLE_MS;
      
      // Descobre qual slide deve estar ativo (0, 1 ou 2)
      const targetSlideIndex = Math.floor(currentCyclePositionMs / SLIDE_DURATION_MS);
      
      // Descobre a porcentagem de progresso do slide corrente
      const currentSlideProgressMs = currentCyclePositionMs % SLIDE_DURATION_MS;
      const progressPercent = (currentSlideProgressMs / SLIDE_DURATION_MS) * 100;

      // Aplica o progresso na barra
      document.getElementById('progressBar').style.width = progressPercent + '%';

      // Se o slide mudou, atualiza a classe ativa
      if (targetSlideIndex !== activeSlideIndex) {
        document.getElementById(`slide${activeSlideIndex}`).classList.remove('active');
        activeSlideIndex = targetSlideIndex;
        
        // Se voltou para o slide 0, rotaciona a notícia
        if (activeSlideIndex === 0) {
          updateNewsDisplay();
        }
        
        document.getElementById(`slide${activeSlideIndex}`).classList.add('active');
      }

      // Requisita o próximo frame
      requestAnimationFrame(syncSlidesBySystemTime);
    }

    // Inicializador seguro de armazenamento de dados locais (híbrido)
    function safeSetCache(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {
        try {
          sessionStorage.setItem(key, JSON.stringify(data));
        } catch(err){}
      }
    }

    function safeGetCache(key) {
      try {
        const d = localStorage.getItem(key) || sessionStorage.getItem(key);
        return d ? JSON.parse(d) : null;
      } catch(e) {
        return null;
      }
    }

    // CLIMA
    async function fetchWeather() {
      try {
        const API_KEY = 'b0b0fbf4fb3bac7908252d23111a524d';
        const CITY = 'Americana,BR';
        const [currRes, foreRes] = await Promise.all([
          fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&units=metric&lang=pt_br&appid=${API_KEY}`),
          fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${CITY}&units=metric&lang=pt_br&appid=${API_KEY}`)
        ]);
        const currData = await currRes.json();
        const foreData = await foreRes.json();
        document.getElementById('wTemp').textContent = Math.round(currData.main.temp);
        document.getElementById('wDesc').textContent = currData.weather[0].description;
        document.getElementById('wFeels').textContent = Math.round(currData.main.feels_like);
        document.getElementById('wHumi').textContent = currData.main.humidity;
        const next24h = foreData.list.slice(0, 8);
        document.getElementById('wMin').textContent = Math.floor(Math.min(...next24h.map(i => i.main.temp_min)));
        document.getElementById('wMax').textContent = Math.ceil(Math.max(...next24h.map(i => i.main.temp_max)));
        const iconMap = {"01d":"☀️","01n":"🌙","02d":"⛅","02n":"☁️","03d":"☁️","03n":"☁️","04d":"🌥️","04n":"☁️","09d":"🌦️","09n":"🌧️","10d":"🌧️","10n":"🌧️","11d":"⛈️","11n":"⛈️","13d":"❄️","13n":"❄️","50d":"🌫️","50n":"🌫️"};
        document.getElementById('wIcon').textContent = iconMap[currData.weather[0].icon] || "☀️";
      } catch (e) {}
    }
    fetchWeather();

    // NOTÍCIAS (Carregamento Ultrarápido com Cache)
    async function fetchNews() {
      const cachedNews = safeGetCache('kloud_cached_news');
      if (cachedNews) {
        allNews = cachedNews;
        updateNewsDisplay();
      }

      try {
        const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://g1.globo.com/rss/g1/sp/campinas-regiao/');
        const d = await r.json();
        if (d.status === 'ok' && d.items && d.items.length > 0) { 
          allNews = d.items; 
          safeSetCache('kloud_cached_news', d.items);
          updateNewsDisplay(); 
        }
      } catch (e) {}
    }

    function updateNewsDisplay() {
      if (allNews.length === 0) return;
      const clean = (t) => t.replace(/<[^>]*>?/gm, '').trim();
      const main = allNews[currentNewsIndex];
      const backupImg = 'https://images.unsplash.com/photo-1504711432869-efd597cdd04b?q=80&w=1200&auto=format&fit=crop';
      const mainImgElement = document.getElementById('newsImg0');
      let imageUrl = main.thumbnail || (main.enclosure ? main.enclosure.link : '');
      mainImgElement.src = imageUrl || backupImg;
      mainImgElement.onerror = function() { this.src = backupImg; };
      document.getElementById('newsTitle0').textContent = main.title;
      document.getElementById('newsDesc0').textContent = clean(main.description).substring(0, 160) + '...';
      for(let i=1; i<=3; i++) {
        const n = allNews[(currentNewsIndex + i) % allNews.length];
        document.getElementById(`newsTitle${i}`).textContent = n.title;
        document.getElementById(`newsDesc${i}`).textContent = clean(n.description).substring(0, 100) + '...';
      }
      currentNewsIndex = (currentNewsIndex + 1) % allNews.length;
    }
    fetchNews();

    // LOTERIAS
    async function fetchLotto() {
      const container = document.getElementById('lottoContent');
      try {
        const [mega, quina, loto] = await Promise.all([
          fetch('https://loteriascaixa-api.herokuapp.com/api/megasena/latest').then(r => r.json()),
          fetch('https://loteriascaixa-api.herokuapp.com/api/quina/latest').then(r => r.json()),
          fetch('https://loteriascaixa-api.herokuapp.com/api/lotofacil/latest').then(r => r.json())
        ]);
        const data = [
          { id: 'mega', name: 'MEGA-SENA', logo: 'https://kloudads.com.br/wp-content/uploads/2026/04/mega.png', d: mega, c: 'var(--mega)' },
          { id: 'quina', name: 'QUINA', logo: 'https://kloudads.com.br/wp-content/uploads/2026/04/quina.png', d: quina, c: 'var(--quina)' },
          { id: 'loto', name: 'LOTOFÁCIL', logo: 'https://kloudads.com.br/wp-content/uploads/2026/04/lotofacil.png', d: loto, c: 'var(--loto)' }
        ];
        container.innerHTML = data.map(g => `
          <div class="lotto-card">
            <div class="lotto-header">
              <img src="${g.logo}" alt="${g.name}" class="lotto-logo">
              <div class="lotto-info">CONCURSO ${g.d.concurso} • ${g.d.data}</div>
            </div>
            <div class="ball-container">
              <div class="ball-grid ${g.id === 'mega' ? 'mega-line' : ''}">
                ${g.d.dezenas.map(n => `<div class="ball-item" style="background: ${g.c}">${n}</div>`).join('')}
              </div>
            </div>
            <div class="prize-box">
              <p class="prize-label">Prêmio Estimado</p>
              <p class="prize-amount">R$ ${g.d.valorEstimadoProximoConcurso.toLocaleString('pt-BR')}</p>
            </div>
          </div>`).join('');
      } catch (e) {}
    }
    fetchLotto();

    // TRADUTOR
    async function translateText(text) {
      try {
        const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();
        return data[0].map(item => item[0]).join('');
      } catch (e) { return text; }
    }

    // HORÓSCOPO (Carregamento Ultrarápido com Cache)
    async function fetchHoroscope() {
      const cachedHoro = safeGetCache('kloud_cached_horo');
      if (cachedHoro) {
        renderHoroscope(cachedHoro);
      }

      const promises = ZODIAC_DATA.map(async (signoObj) => {
        try {
          const res = await fetch(`https://api.api-ninjas.com/v1/horoscope?zodiac=${signoObj.slug}`, {
            headers: { 'X-Api-Key': NINJAS_API_KEY }
          });
          const data = await res.json();
          let textPortuguese = await translateText(data.horoscope || "");
          let firstPoint = textPortuguese.indexOf('.');
          let secondPoint = textPortuguese.indexOf('.', firstPoint + 1);
          if (secondPoint !== -1) {
            textPortuguese = textPortuguese.substring(0, secondPoint + 1);
          } else if (firstPoint !== -1) {
            textPortuguese = textPortuguese.substring(0, firstPoint + 1);
          }
          return { ...signoObj, texto: textPortuguese };
        } catch (e) {
          return { ...signoObj, texto: "As estrelas estão preparando novidades." };
        }
      });
      
      const results = await Promise.all(promises);
      safeSetCache('kloud_cached_horo', results);
      renderHoroscope(results);
    }

    function renderHoroscope(data) {
      const grid = document.getElementById('horoGrid');
      grid.innerHTML = data.map(item => `
        <div class="horo-box">
          <header><span>${item.s}</span><span>${item.i}</span></header>
          <p>${item.texto}</p>
        </div>
      `).join('');
    }

    fetchHoroscope();
    setInterval(fetchHoroscope, 43200000); // 12 horas

    // Ativa o alinhamento de tempo instantâneo
    syncSlidesBySystemTime();
  </script>
</body>
</html>
