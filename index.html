<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KloudAds Cinema Display - Notícias</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #020617;
      --accent: #FFD700;
      --text: #f8fafc;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.15);
      --sidebar-width: 22vw;
      --bg-blue: #003366;
      --bg-gradient: radial-gradient(circle at 10% 10%, #00509e 0%, #003366 45%),
                    radial-gradient(circle at 90% 90%, #004080 0%, #003366 45%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; border: none !important; }

    body, html {
      width: 100vw; height: 100vh; 
      overflow: hidden !important; 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-blue); color: var(--text);
    }

    .bg-animation {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-gradient);
      z-index: -1;
    }

    .app-container {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      width: 100%; height: 100%;
    }

    .sidebar {
      background: rgba(0, 30, 60, 0.6);
      backdrop-filter: blur(30px);
      padding: 4vh 2vw; 
      display: flex; 
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid var(--glass-border);
      height: 100vh;
      min-width: 280px;
    }

    .clock-section { text-align: center; }
    .clock {
      font-size: 5.5vw; font-weight: 800; line-height: 0.9;
      letter-spacing: -3px; color: var(--accent);
      text-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
    }

    .date {
      font-size: 0.9vw; text-transform: uppercase; letter-spacing: 1px; 
      margin-top: 1.5vh; color: #fff; opacity: 0.9; font-weight: 600;
      white-space: nowrap; display: block;
    }

    .weather-card {
      background: var(--glass); border-radius: 2vw; 
      padding: 3vh 1.5vw; text-align: center;
      border: 1px solid var(--glass-border) !important;
      margin: 2vh 0;
    }

    .city-name { font-size: 1.2vw; font-weight: 800; margin-bottom: 1.5vh; text-transform: uppercase; }
    .w-icon-main { font-size: 4vw; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); line-height: 1.1; }
    .temp-now { font-size: 4.5vw; font-weight: 800; line-height: 1; }
    .w-desc { font-size: 1vw; opacity: 0.9; text-transform: capitalize; margin-bottom: 1.5vh; }

    .w-minmax-row {
      display: flex; gap: 1.5vw; justify-content: center;
      margin-bottom: 2vh; border-top: 1px solid var(--glass-border) !important;
      padding-top: 1.5vh; width: 85%; margin: 0 auto 2vh;
    }
    .w-mm-val { font-size: 1.4vw; font-weight: 800; display: flex; align-items: center; gap: 4px; }

    .w-footer-info {
      display: flex; justify-content: space-around;
      background: rgba(255,255,255,0.05); padding: 1.2vh 1vw; border-radius: 1vw;
    }
    .w-f-val { font-size: 1vw; font-weight: 800; }

    .logo-area { text-align: center; padding-bottom: 1vh; }
    .logo-area img { width: 100%; max-width: 240px; height: auto; object-fit: contain; }
    .site-url { font-size: 0.65vw; letter-spacing: 3px; opacity: 0.6; margin-top: 1vh; }

    .main-area { position: relative; padding: 4vh 3vw; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .slide {
      display: flex; flex-direction: column; flex: 1;
    }

    .slide-title { font-size: 2.2vw; font-weight: 800; margin-bottom: 3vh; display: flex; align-items: center; gap: 25px; flex-shrink: 0; }
    .slide-title::after { content: ''; height: 4px; flex: 1; background: linear-gradient(90deg, var(--accent), transparent); border-radius: 2px; }

    .news-wrapper { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2vw; flex: 1; overflow: hidden; margin-bottom: 2vh; min-height: 0; }
    .news-featured { position: relative; border-radius: 2.5vw; overflow: hidden; background: #004080; height: 100%; }
    .news-featured img { width: 100%; height: 100%; object-fit: cover; }
    .news-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 10vh 3vw 4vh; background: linear-gradient(transparent, rgba(0,30,60,0.98)); }
    .news-overlay h3 { font-size: 2.2vw; line-height: 1.2; margin-bottom: 1.5vh; color: var(--accent); font-weight: 800; }
    .news-overlay p { font-size: 1.1vw; opacity: 0.95; line-height: 1.4; }
    
    .news-secondary { display: grid; grid-template-rows: repeat(3, 1fr); gap: 1.5vh; height: 100%; }
    .news-item { background: var(--glass); border-radius: 1.5vw; padding: 2vh 2vw; border: 1px solid var(--glass-border) !important; display: flex; flex-direction: column; justify-content: center; }
    .news-item h4 { font-size: 1.15vw; font-weight: 700; line-height: 1.3; }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="app-container">
    <aside class="sidebar">
      <div class="clock-section">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">--</div>
      </div>
      <div class="weather-card">
        <div class="city-name">AMERICANA - SP</div>
        <div id="wIcon" class="w-icon-main">--</div>
        <div class="temp-now"><span id="wTemp">--</span>°</div>
        <div class="w-desc" id="wDesc">Carregando...</div>
        <div class="w-minmax-row">
          <div class="w-mm-item"><span class="w-mm-val" style="color: #60a5fa;">↓<span id="wMin">--</span>°</span></div>
          <div class="w-mm-item"><span class="w-mm-val" style="color: #ef4444;">↑<span id="wMax">--</span>°</span></div>
        </div>
        <div class="w-footer-info">
           <div class="w-f-item"><span class="w-f-val"><span id="wFeels">--</span>°C</span></div>
           <div class="w-f-item"><span class="w-f-val"><span id="wHumi">--</span>% UR</span></div>
        </div>
      </div>
      <div class="logo-area">
        <img src="https://site.wpmaster.com.br/wp-content/uploads/2026/04/logo-kloudads-e1776133415159.png" alt="KloudAds">
        <div class="site-url">WWW.KLOUDADS.COM.BR</div>
      </div>
    </aside>

    <main class="main-area">
      <section class="slide">
        <h2 class="slide-title">Notícias da Região</h2>
        <div class="news-wrapper">
          <div class="news-featured">
            <img src="" id="newsImg0">
            <div class="news-overlay">
              <h3 id="newsTitle0">Buscando notícias...</h3>
              <p id="newsDesc0"></p>
            </div>
          </div>
          <div class="news-secondary">
            <div class="news-item"><h4 id="newsTitle1">...</h4><p id="newsDesc1"></p></div>
            <div class="news-item"><h4 id="newsTitle2">...</h4><p id="newsDesc2"></p></div>
            <div class="news-item"><h4 id="newsTitle3">...</h4><p id="newsDesc3"></p></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const dateOptions = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', dateOptions).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function safeSetCache(key, data) {
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    }

    function safeGetCache(key) {
      try {
        const d = localStorage.getItem(key);
        return d ? JSON.parse(d) : null;
      } catch(e) { return null; }
    }

    async function fetchWeather() {
      try {
        const API_KEY = 'b0b0fbf4fb3bac7908252d23111a524d';
        const CITY = 'Americana,BR';
        const [currRes, foreRes] = await Promise.all([
          fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&units=metric&lang=pt_br&appid=${API_KEY}`),
          fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${CITY}&units=metric&lang=pt_br&appid=${API_KEY}`)
        ]);
        const currData = await currRes.json();
        const foreData = await foreRes.json();
        document.getElementById('wTemp').textContent = Math.round(currData.main.temp);
        document.getElementById('wDesc').textContent = currData.weather[0].description;
        document.getElementById('wFeels').textContent = Math.round(currData.main.feels_like);
        document.getElementById('wHumi').textContent = currData.main.humidity;
        const next24h = foreData.list.slice(0, 8);
        document.getElementById('wMin').textContent = Math.floor(Math.min(...next24h.map(i => i.main.temp_min)));
        document.getElementById('wMax').textContent = Math.ceil(Math.max(...next24h.map(i => i.main.temp_max)));
        const iconMap = {"01d":"☀️","01n":"🌙","02d":"⛅","02n":"☁️","03d":"☁️","03n":"☁️","04d":"🌥️","04n":"☁️","09d":"🌦️","09n":"🌧️","10d":"🌧️","10n":"🌧️","11d":"⛈️","11n":"⛈️","13d":"❄️","13n":"❄️","50d":"🌫️","50n":"🌫️"};
        document.getElementById('wIcon').textContent = iconMap[currData.weather[0].icon] || "☀️";
      } catch (e) {}
    }
    fetchWeather();

    async function fetchNews() {
      const cachedNews = safeGetCache('kloud_cached_news');
      if (cachedNews) {
        updateNewsDisplay(cachedNews);
      }
      try {
        const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://g1.globo.com/rss/g1/sp/campinas-regiao/');
        const d = await r.json();
        if (d.status === 'ok' && d.items && d.items.length > 0) { 
          safeSetCache('kloud_cached_news', d.items);
          updateNewsDisplay(d.items); 
        }
      } catch (e) {}
    }

    function updateNewsDisplay(allNews) {
      if (!allNews || allNews.length === 0) return;
      const clean = (t) => t.replace(/<[^>]*>?/gm, '').trim();
      const main = allNews[0];
      const backupImg = 'https://images.unsplash.com/photo-1504711432869-efd597cdd04b?q=80&w=1200&auto=format&fit=crop';
      const mainImgElement = document.getElementById('newsImg0');
      let imageUrl = main.thumbnail || (main.enclosure ? main.enclosure.link : '');
      mainImgElement.src = imageUrl || backupImg;
      mainImgElement.onerror = function() { this.src = backupImg; };
      document.getElementById('newsTitle0').textContent = main.title;
      document.getElementById('newsDesc0').textContent = clean(main.description).substring(0, 160) + '...';
      for(let i=1; i<=3; i++) {
        const n = allNews[i % allNews.length];
        document.getElementById(`newsTitle${i}`).textContent = n.title;
        document.getElementById(`newsDesc${i}`).textContent = clean(n.description).substring(0, 100) + '...';
      }
    }
    fetchNews();
  </script>
</body>
</html>
